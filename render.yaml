services:
  - type: web
    name: embertext
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: embertext-db
          property: connectionString
      - key: ADMIN_SECRET_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_ADMIN_SECRET
        fromEnvVar: ADMIN_SECRET_TOKEN

databases:
  - name: embertext-db
    databaseName: embertext
    user: embertext
